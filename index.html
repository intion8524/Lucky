<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฮง เฮง เฮง</title>

    <link rel="stylesheet" href="style.css">
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="dist/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="dist/sweetalert2.min.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap');

        /* ── VARIABLES ── */
        :root {
            --primary:      #003359;   /* น้ำเงินเข้ม — หลัก */
            --primary-mid:  #005a8e;   /* น้ำเงินกลาง */
            --primary-light:#e8f2fa;   /* น้ำเงินอ่อนมาก — พื้นหลัง hover */
            --accent:       #1a6b2a;   /* เขียว — action หลัก */
            --accent-light: #27ae60;
            --danger:       #c0392b;
            --warn-bg:      #fffde7;
            --warn-border:  #f9a825;
            --bg-page:      #eef2f7;   /* พื้นหลังหน้า — เทาน้ำเงินอ่อน */
            --bg-card:      #ffffff;
            --bg-input:     #ffffff;   /* ขาว */
            --text-main:    #1a2a3a;
            --text-muted:   #5a7080;
            --border:       #d0dce8;
        }

        body {
            background: var(--bg-page);
            font-family: 'Kanit', sans-serif;
            color: var(--text-main);
        }

        /* ── TOPBAR ── */
        .topbar {
            background: var(--primary);
            color: white;
            padding: 0 16px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,51,89,0.35);
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .topbar-brand {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: white;
        }
        .topbar-nav { display: flex; align-items: center; gap: 6px; }
        .topbar-nav a {
            color: rgba(255,255,255,0.82);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 5px 10px;
            border-radius: 7px;
            transition: background 0.15s;
        }
        .topbar-nav a:hover { background: rgba(255,255,255,0.14); color: white; }
        .btn-logout {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.28);
            color: white;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            transition: background 0.15s;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.2); }

        /* ── TITLE BAR ── */
        #titleBar {
            background: var(--primary-mid);
            color: white;
            text-align: center;
            padding: 9px 16px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,51,89,0.2);
        }

        /* ── MAIN ── */
        .page { padding: 14px; max-width: 960px; margin: 0 auto; }

        /* ── CARD ── */
        .card-box {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,51,89,0.1);
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .card-header-bar {
            background: var(--primary);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header-bar .title {
            color: white;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 1px;
        }
        .card-header-bar .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
        }
        .card-body-pad { padding: 16px; }

        /* ── FORM ── */
        .form-label-custom {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.5px;
        }
        .form-control-custom, .form-select-custom {
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.92rem;
            font-family: 'Kanit', sans-serif;
            width: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: var(--primary-mid);
            box-shadow: 0 0 0 3px rgba(0,90,142,0.12);
            outline: none;
            background: white;
        }
        .bill-display {
            background: var(--primary-light);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }
        .bill-display label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .bill-display input {
            border: none;
            background: transparent;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            width: 100%;
            min-width: 0;
            outline: none;
            font-family: 'Kanit', sans-serif;
            -moz-appearance: textfield; /* ซ่อนลูกศร Firefox */
            appearance: textfield;
        }
        /* ซ่อนลูกศร input number บน Chrome/Safari */
        .bill-display input::-webkit-outer-spin-button,
        .bill-display input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        textarea.form-control-custom {
            min-height: 180px;
            resize: vertical;
            line-height: 1.8;
            font-size: 0.95rem;
            background: var(--bg-input);
        }

        /* ── SAVE BUTTON ── */
        .btn-save {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            box-shadow: 0 4px 12px rgba(26,107,42,0.3);
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 12px;
        }
        .btn-save:hover { opacity: 0.9; }
        .btn-save:active { transform: scale(0.985); }

        /* ── TABLE ── */
        .table-wrap { max-height: 420px; overflow-y: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table thead th {
            background: var(--primary);
            color: white;
            font-weight: 700;
            padding: 10px 12px;
            position: sticky;
            top: 0;
            z-index: 1;
            border: none;
            text-align: left;
        }
        .data-table tbody tr { border-bottom: 1px solid #edf2f7; }
        .data-table tbody tr:hover { background: var(--primary-light); }
        .data-table td { padding: 8px 12px; vertical-align: middle; }
        .data-table td:nth-child(2) { font-weight: 800; color: var(--primary); }
        .data-table td:nth-child(4) { font-weight: 700; color: var(--accent); }

        /* ── WARN ROW ── */
        .warn-row { background: var(--warn-bg) !important; border-left: 3px solid var(--warn-border) !important; }
        .warn-row:hover { background: #fff9c4 !important; }

        /* ── EDIT BUTTON ── */
        .btn-edit {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn-edit:hover { background: #d0e8f8; }

        .ShowDatainput { line-height: 1.6; color: var(--text-muted); font-size: 0.8rem; }

        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,40,0.55);
            backdrop-filter: blur(3px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,51,89,0.25);
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(16px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
        }
        .modal-header h5 { margin: 0; color: var(--primary); font-weight: 800; font-size: 1rem; }
        .modal-close {
            background: #f0f2f5; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 1rem;
            cursor: pointer; color: #888;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #dde3ea; }
        .modal-grid { display: grid; grid-template-columns: 1fr 90px; gap: 10px; margin-bottom: 12px; }
        .modal-label {
            display: block; font-size: 0.72rem; font-weight: 700;
            color: var(--text-muted); letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 4px;
        }
        .modal-select, .modal-input, .modal-textarea {
            width: 100%; border: 1.5px solid var(--border);
            border-radius: 9px; padding: 8px 10px;
            font-size: 0.9rem; font-family: 'Kanit', sans-serif;
            background: var(--bg-input);
            transition: border-color 0.2s;
        }
        .modal-select:focus, .modal-input:focus, .modal-textarea:focus {
            border-color: var(--primary-mid); outline: none; background: white;
        }
        .modal-input { text-align: center; font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .modal-textarea { min-height: 120px; resize: vertical; margin-bottom: 14px; line-height: 1.7; }
        .modal-actions { display: flex; gap: 8px; }
        .btn-modal-save {
            flex: 1; background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none; border-radius: 10px; color: white;
            font-weight: 700; padding: 11px; cursor: pointer;
            font-size: 0.9rem; font-family: 'Kanit', sans-serif;
            box-shadow: 0 3px 8px rgba(26,107,42,0.25);
        }
        .btn-modal-delete {
            flex: 1; background: linear-gradient(135deg, #922b21, var(--danger));
            border: none; border-radius: 10px; color: white;
            font-weight: 700; padding: 11px; cursor: pointer;
            font-size: 0.9rem; font-family: 'Kanit', sans-serif;
        }
        .btn-modal-cancel {
            width: 100%; margin-top: 8px; background: #eef2f7;
            border: none; border-radius: 10px; color: var(--text-muted);
            font-weight: 600; padding: 10px; cursor: pointer;
            font-size: 0.88rem; font-family: 'Kanit', sans-serif;
        }
        .btn-modal-cancel:hover { background: #dde3ea; }

        /* ── LAYOUT ── */
        .form-grid {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 14px;
            align-items: start;
        }
        .form-left { display: flex; flex-direction: column; gap: 10px; }
        @media (max-width: 680px) {
            .form-grid { grid-template-columns: 1fr; }
            .bill-display input { font-size: 1.5rem; }
        }
        @media (min-width: 681px) and (max-width: 900px) {
            .form-grid { grid-template-columns: 130px 1fr; }
            .bill-display input { font-size: 1.6rem; }
        }

        #contrainer-Login { display: none !important; }
    </style>
</head>
<body>

<!-- hidden elements ที่ app.js ต้องการ -->
<div id="contrainer-Login" style="display:none;">
    <input id="datepicker">
    <select id="ddlListHui"></select>
    <input id="UserLogin">
    <input id="UserPassWord">
    <button id="btnLogin"></button>
</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-brand">เฮง เฮง เฮง</div>
    <div class="topbar-nav" id="navForMom" style="display:none;">
        <a href="ScreenShot.html" id="linkScreenshot" style="display:none;">📊 แสดงผล</a>
        <a href="Conclusion.html" id="linkConclusion" style="display:none;">📋 สรุปผล</a>
        <a href="admin.html" id="linkAdmin" style="display:none;">⚙️ จัดการ</a>
        <button class="btn-logout" id="btnLogout">ออกจากระบบ</button>
    </div>
</div>

<!-- TITLE งวด — แสดงใต้ topbar ให้เห็นชัด -->
<div id="titleBar" style="display:none;"></div>

<!-- MAIN -->
<div class="page" id="contrainer-InputData">

    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="card-box">
        <div class="card-header-bar">
            <span class="title">📝 กรอกข้อมูลการแทง</span>
            <span class="subtitle" id="userDisplayName"></span>
        </div>
        <div class="card-body-pad">
            <form id="addForm">
                <div class="form-grid">

                    <!-- ซ้าย -->
                    <div class="form-left">
                        <div>
                            <label class="form-label-custom">ลูกค้า</label>
                            <select name="name" class="form-select-custom" id="CustName"></select>
                        </div>
                        <div class="bill-display">
                            <label>บิลที่</label>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <button type="button" id="btnBillMinus"
                                    style="width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);
                                    background:var(--bg-page);font-size:1.2rem;font-weight:700;cursor:pointer;
                                    color:var(--primary);flex-shrink:0;line-height:1;">−</button>
                                <input type="number" name="Bill" id="billInput" value="1" min="1"
                                    style="flex:1;text-align:center;">
                                <button type="button" id="btnBillPlus"
                                    style="width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);
                                    background:var(--bg-page);font-size:1.2rem;font-weight:700;cursor:pointer;
                                    color:var(--primary);flex-shrink:0;line-height:1;">+</button>
                            </div>
                            <div id="billHint" style="font-size:0.65rem;margin-top:3px;min-height:14px;"></div>
                        </div>
                        <div style="display:none;">
                            <input type="text" name="TimeSet">
                            <input type="text" name="tbxRoodNumber" value="">
                        </div>
                    </div>

                    <!-- ขวา -->
                    <div>
                        <label class="form-label-custom">กรอกตัวเลข</label>
                        <textarea name="AllNumber" class="form-control-custom"
                            ></textarea>
                    </div>

                </div>

                <button type="submit" class="btn-save">💾  บันทึก</button>
            </form>
        </div>
    </div>

    <!-- ตารางข้อมูล -->
    <div class="card-box">
        <div class="card-header-bar">
            <span class="title">📋 รายการที่บันทึก</span>
            <span class="subtitle" id="tableFilterLabel"></span>
        </div>
        <div class="table-wrap">
            <table class="data-table" id="tableDatalist">
                <thead>
                    <tr>
                        <th style="width:80px;">แก้ไข</th>
                        <th style="width:55px;cursor:pointer;user-select:none;" id="thBillSort" title="กดเพื่อเรียงลำดับ">บิล ▲</th>
                        <th style="width:120px;">ชื่อ</th>
                        <th style="width:110px;">ยอดเงิน</th>
                        <th>เลข</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL แก้ไข/ลบ -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <div class="modal-header">
            <h5 id="modalTitle">แก้ไขบิล</h5>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <input type="hidden" id="modalBillId">
        <div class="modal-grid">
            <div>
                <label class="modal-label">ลูกค้า</label>
                <select class="modal-select" id="modalCustName"></select>
            </div>
            <div>
                <label class="modal-label">บิลที่</label>
                <input type="number" class="modal-input" id="modalBill" min="1">
            </div>
        </div>
        <label class="modal-label">ตัวเลข</label>
        <textarea class="modal-textarea" id="modalNumbers"></textarea>
        <div class="modal-actions">
            <button class="btn-modal-save"   onclick="saveEdit()">💾 บันทึก</button>
            <button class="btn-modal-delete" onclick="deleteBill()">🗑️ ลบบิล</button>
        </div>
        <button class="btn-modal-cancel" onclick="closeModal()">ยกเลิก</button>
    </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
